name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract Android project
        run: unzip -q AsimSetsQuiz-Android-Project.zip

      - name: Build APK
        run: gradle -p AsimSetsQuiz assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsimSetsQuiz-APK
          path: AsimSetsQuiz/app/build/outputs/apk/debug/app-debug.apk
