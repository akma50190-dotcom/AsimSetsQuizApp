<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة ليبيا إكسچنج</title><link rel="stylesheet" href="style.css"></head><body><main class="admin"><h1>لوحة الإدارة</h1><p>إدارة بيانات السوق الموازي والمصارف والتنبيهات.</p><section id="login" class="panel"><h2>تسجيل الدخول</h2><input id="user" value="admin" placeholder="المستخدم"><input id="pass" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><small>الافتراضي لأول تشغيل: admin / admin123 — غيّره عبر ADMIN_PASSWORD قبل النشر.</small></section><div id="dash" hidden>
<section class="panel"><h2>إضافة سعر السوق الموازية</h2><div class="form"><input id="pb" placeholder="شراء"><input id="ps" placeholder="بيع"><input id="city" value="طرابلس" placeholder="المدينة"><input id="src" value="إدخال إداري" placeholder="المصدر"><button onclick="addParallel()">حفظ</button></div></section>
<section class="panel"><h2>إضافة/تحديث مصرف</h2><div class="form"><input id="bn" placeholder="اسم المصرف"><input id="ub" placeholder="USD شراء"><input id="us" placeholder="USD بيع"><input id="eb" placeholder="EUR شراء"><input id="es" placeholder="EUR بيع"><input id="bc" value="ليبيا" placeholder="المدينة"><button onclick="addBank()">حفظ</button></div><div id="bankList"></div></section>
<section class="panel"><h2>تنبيه سعر الدولار</h2><div class="form"><input id="an" value="تنبيه الدولار" placeholder="اسم"><select id="am"><option value="parallel">موازي</option><option value="official">رسمي</option></select><select id="ad"><option value="above">عند الوصول فوق</option><option value="below">عند الهبوط تحت</option></select><input id="av" placeholder="السعر"><button onclick="addAlert()">حفظ</button></div><div id="alertList"></div></section></div></main><script src="admin.js"></script></body></html>
